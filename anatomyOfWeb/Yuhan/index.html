<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="infobar">
        <img class="infobar_topimg" src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/04/69/e6/e8/quanjude-sanyuanqiao.jpg?w=900&h=500&s=1" alt="">
        <div class="infobar_headerwrapper">
            <h1 class="infobar_header_h1">Quanjude</h1>
            <h2 class="infobar_header_h2"><span style="font-size: 14px;">全聚德</span></h2>
            <div class="infobar_header_ratinginfo">
                <span class="infobar_header_ratinginfo_star">
                    <span class="ratingfont">4.0</span>
                    <span class="star_list">
                        <span class="icon_star"></span>
                        <span class="icon_star"></span>
                        <span class="icon_star"></span>
                        <span class="icon_star"></span>
                        <span class="icon_star no">
                        </span>
                    </span>
                    <span class="ratingfont">(50)</span>
                    <span class="ratingfont"> · $$$</span>
                </span>
            </div>
            <p class="infobar_header_category">
                <a class="category_link" href="#">Chinese restaurant</a>
            </p>
        </div>
        <div class="infobar_tabs">
            <div class="infobar_tab infobar_tab_active">Overview</div>
            <div class="infobar_tab">Menu</div>
            <div class="infobar_tab">Reviews</div>
            <div class="infobar_tab">About</div>
    </div>  
</body>
</html>
